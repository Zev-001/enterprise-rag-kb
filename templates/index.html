<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业知识库问答系统</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📚</span>
        <div>
          <h1>企业知识库问答</h1>
          <p class="sub">上传公司文档，基于文档问答，答案可溯源</p>
        </div>
      </div>
      <div class="kb-status" id="kbStatus">知识库：加载中…</div>
      <input type="password" id="apiToken" class="token-input"
             placeholder="访问令牌 token（见 acl.json 的 admin）" />
    </header>

    <main class="layout">
      <!-- 左侧：上传 + 文档列表 -->
      <aside class="sidebar">
        <section class="upload-card">
          <h2>① 上传文档</h2>
          <label class="dropzone" id="dropzone">
            <input type="file" id="fileInput" multiple
                   accept=".pdf,.docx,.txt,.md" hidden />
            <div class="dz-inner">
              <span class="dz-icon">⬆️</span>
              <p>点击选择 或 拖拽文件到这里</p>
              <small>支持 PDF / Word / TXT / Markdown（可多选）</small>
            </div>
          </label>
          <div id="uploadMsg" class="upload-msg"></div>
        </section>

        <section class="doclist-card">
          <h2>② 已入库文档</h2>
          <ul id="docList" class="doc-list"><li class="empty">暂无文档</li></ul>
        </section>
      </aside>

      <!-- 右侧：对话 -->
      <section class="chat">
        <div class="messages" id="messages">
          <div class="msg bot">
            <div class="bubble">
              你好，我是企业知识库助手 👋<br/>
              先在左边上传公司文档（员工手册、产品说明、制度文件都行），
              然后直接在下面提问，我会基于文档回答并标出来源。
            </div>
          </div>
        </div>

        <div class="composer-tools">
          <label class="tool">
            <span>检索</span>
            <select id="retrieval">
              <option value="default">语义+关键词（默认）</option>
              <option value="graph">图谱多跳（D7）</option>
            </select>
          </label>
          <label class="tool">
            <input type="checkbox" id="agentMode" /> <span>智能体（D8）</span>
          </label>
          <label class="tool">
            <input type="checkbox" id="streamMode" checked /> <span>流式（D15）</span>
          </label>
          <label class="tool">
            <input type="checkbox" id="cacheMode" checked /> <span>缓存（D15）</span>
          </label>
        </div>

        <form class="composer" id="composer">
          <input type="text" id="question" placeholder="例如：年假怎么请？报销上限是多少？" autocomplete="off" />
          <button type="submit" id="sendBtn">发送</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const fileInput = $("#fileInput");
    const dropzone = $("#dropzone");
    const uploadMsg = $("#uploadMsg");
    const docList = $("#docList");
    const kbStatus = $("#kbStatus");
    const messages = $("#messages");
    const composer = $("#composer");
    const question = $("#question");
    const sendBtn = $("#sendBtn");
    const apiToken = $("#apiToken");

    // 把 token 拼到 URL（D1+D5：所有 API 必须带 token）
    function tokenParam() {
      const t = (apiToken.value || "").trim();
      return t ? ("?token=" + encodeURIComponent(t)) : "";
    }

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // D16 置信度徽章：高=绿 / 中=黄 / 低=红，鼠标悬停看理由
    function confidenceBadge(conf, level, reason) {
      if (conf === undefined || conf === null) return "";
      const pct = Math.round((conf || 0) * 100);
      const lv = level || (pct >= 70 ? "high" : pct >= 40 ? "medium" : "low");
      const label = { high: "可信", medium: "可核对", low: "建议复核" }[lv] || "可核对";
      const tips = (reason || []).map(escapeHtml).join("；");
      return "<span class='badge badge-" + lv + "' title='" + tips + "'>" +
             "🎯 " + pct + "% " + label + "</span>";
    }

    // JSON Schema 硬约束质检徽章（schema_qc，借鉴 GEOFlow 质量门禁）
    // 四态质检 + 兜底态，鼠标悬停看逐条断言台账与资料缺口
    function qcBadge(qc, action) {
      if (!qc || !qc.status) return "";
      const st = qc.status;
      const mode = qc.mode || "";
      const s = qc.summary || {};
      // 回退/短路态：诚实标注「不是结构化判定」，别让人误当成硬证据
      if (mode.indexOf("json") !== 0) {
        const tip = (qc.reasons || []).concat(qc.errors || []).map(escapeHtml).join("；");
        return "<span class='badge badge-muted' title='" + (tip || "未做结构化质检") + "'>" +
               "🔍 启发式兜底 · " + escapeHtml(st) + "</span>";
      }
      const label = { answered: "有据可答", partial: "部分有据",
                      refused: "资料未提及", unsupported: "无依据·疑似幻觉" }[st] || st;
      const cls = st === "answered" ? "badge-high"
                : st === "partial" ? "badge-medium"
                : st === "refused" ? "badge-muted" : "badge-low";
      const icon = st === "answered" ? "✅" : st === "partial" ? "⚠️"
                 : st === "refused" ? "🚫" : "⛔";
      const tips = [
        "断言 " + (s.claims || 0) + " 条：" + (s.supported || 0) + " 有据 / " +
          (s.weak || 0) + " 弱据 / " + (s.unsupported || 0) + " 无据",
      ].concat(qc.reasons || []).concat(qc.errors || []).map(escapeHtml).join("；");
      let html = "<span class='badge " + cls + "' title='" + tips + "'>" +
                 icon + " " + label + "</span>";
      if (qc.missing) {
        const m = escapeHtml(String(qc.missing));
        html += "<span class='badge badge-muted' title='资料缺口：" + m + "'>" +
                "📌 缺口：" + m.slice(0, 18) + "</span>";
      }
      if (action === "block" && st === "unsupported") {
        html += "<span class='badge badge-low' " +
                "title='RAG_QC_ACTION=block：无依据答案已被门禁拦截'>🛑 已拦截</span>";
      }
      return html;
    }

    // D14/D15 元信息行：命中块数、上下文压缩、是否命中缓存、检索模式
    function metaLine(meta) {
      if (!meta) return "";
      const bits = [];
      if (meta.hits !== undefined) bits.push("命中 " + meta.hits + " 块");
      const c = meta.compress || {};
      if (c.total_hits && c.chunks_in_ctx !== undefined) {
        bits.push("上下文 " + c.total_hits + "→" + c.chunks_in_ctx + " 块" +
                  (c.merged ? "（去重 " + c.merged + "）" : ""));
      }
      if (meta.mode && meta.mode !== "default") {
        bits.push("模式 " + escapeHtml(meta.mode));
      }
      if (meta.from_cache) bits.push("⚡ 缓存命中");
      if (meta.steps) bits.push("推理 " + meta.steps + " 步");
      if (!bits.length) return "";
      return "<div class='meta-line'>" + bits.map(escapeHtml).join(" · ") + "</div>";
    }

    // 渲染一条消息（sources/meta 支持事后更新，供流式用）
    function addMessage(role, answer, sources, meta) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = escapeHtml(answer || "").replace(/\n/g, "<br/>");
      wrap.appendChild(bubble);

      const metaBox = document.createElement("div");
      metaBox.className = "answer-meta";
      metaBox.innerHTML =
        confidenceBadge(meta && meta.confidence, meta && meta.confidence_level,
                        meta && meta.confidence_reason) +
        qcBadge(meta && meta.qc, meta && meta.qc_action) + metaLine(meta);
      wrap.appendChild(metaBox);

      const srcBox = document.createElement("div");
      srcBox.className = "sources";
      wrap.appendChild(srcBox);
      renderSources(srcBox, sources);

      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
      return { wrap: wrap, bubble: bubble, metaBox: metaBox, srcBox: srcBox };
    }

    function renderSources(box, sources) {
      if (!box) return;
      if (!sources || !sources.length) { box.style.display = "none"; return; }
      box.style.display = "";
      box.innerHTML = "<div class='src-title'>📎 来源</div>";
      sources.forEach((s) => {
        const card = document.createElement("div");
        card.className = "src-card";
        const mod = s.modality && s.modality !== "text"
          ? "<span class='src-mod'>" + escapeHtml(s.modality) + "</span>" : "";
        card.innerHTML =
          "<div class='src-head'>[" + s.n + "] 《" + escapeHtml(s.title) +
          "》 " + mod + " <span class='src-score'>相关度 " + s.score + "</span></div>" +
          "<div class='src-snippet'>" + escapeHtml(s.snippet) + "</div>";
        box.appendChild(card);
      });
    }

    // 流式过程中更新一条消息的内容与元信息
    function updateMessage(handle, answer, sources, meta) {
      if (!handle) return;
      handle.bubble.innerHTML = escapeHtml(answer || "").replace(/\n/g, "<br/>");
      handle.metaBox.innerHTML =
        confidenceBadge(meta && meta.confidence, meta && meta.confidence_level,
                        meta && meta.confidence_reason) +
        qcBadge(meta && meta.qc, meta && meta.qc_action) + metaLine(meta);
      renderSources(handle.srcBox, sources);
      messages.scrollTop = messages.scrollHeight;
    }

    function addThinking() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.id = "thinking";
      wrap.innerHTML = "<div class='bubble thinking'>正在查文档…</div>";
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }
    function removeThinking() {
      const t = $("#thinking");
      if (t) t.remove();
    }

    // 拉取知识库状态
    async function refreshStats() {
      try {
        const r = await fetch("/api/stats" + tokenParam());
        const d = await r.json();
        kbStatus.textContent = "知识库：" + d.docs.length + " 份文档 · " + d.chunks + " 个知识块";
        if (d.docs.length === 0) {
          docList.innerHTML = "<li class='empty'>暂无文档</li>";
        } else {
          docList.innerHTML = d.docs.map((x) => "<li>📄 " + escapeHtml(x) + "</li>").join("");
        }
      } catch (e) {
        kbStatus.textContent = "知识库：连接失败";
      }
    }

    // 上传
    async function uploadFiles(fileList) {
      if (!fileList.length) return;
      uploadMsg.textContent = "上传中…";
      const fd = new FormData();
      for (const f of fileList) fd.append("files", f);
      try {
        const r = await fetch("/api/upload" + tokenParam(), { method: "POST", body: fd });
        const d = await r.json();
        if (d.ok) {
          const ok = d.results.filter((x) => x.ok).length;
          const fail = d.results.length - ok;
          uploadMsg.innerHTML = "✅ 成功 " + ok + " 个，失败 " + fail + " 个";
          await refreshStats();
        } else {
          uploadMsg.textContent = "❌ " + d.error;
        }
      } catch (e) {
        uploadMsg.textContent = "❌ 上传失败：" + e.message;
      }
    }

    fileInput.addEventListener("change", (e) => uploadFiles(e.target.files));
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault(); dropzone.classList.remove("drag");
      uploadFiles(e.dataTransfer.files);
    });

    // 会话：把服务端返回的 session_id 存起来，实现 D10 多轮追问（刷新页面即开新会话）
    let sessionId = null;

    function askBody(q, stream) {
      return JSON.stringify({
        question: q,
        session_id: sessionId,
        retrieval: $("#retrieval").value,
        mode: $("#agentMode").checked ? "agent" : "default",
        use_cache: $("#cacheMode").checked,
        stream: !!stream,
      });
    }

    // 流式读取 SSE：逐 token 追加到气泡，done 帧补来源与置信度
    async function askStream(q) {
      const r = await fetch("/api/ask" + tokenParam(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: askBody(q, true),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const reader = r.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buf = "", text = "", handle = null, done = null;
      while (true) {
        const { value, done: fin } = await reader.read();
        if (fin) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch (_) { continue; }
          if (ev.type === "delta") {
            if (!handle) { removeThinking(); handle = addMessage("bot", "", [], null); }
            text += ev.token || "";
            handle.bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br/>");
            messages.scrollTop = messages.scrollHeight;
          } else if (ev.type === "done") {
            done = ev;
          } else if (ev.type === "error") {
            throw new Error(ev.error || "流式失败");
          }
        }
      }
      if (done) {
        if (done.session_id) sessionId = done.session_id;
        const meta = {
          confidence: done.confidence, confidence_level: done.confidence_level,
          confidence_reason: done.confidence_reason, hits: done.hits,
          compress: done.compress, from_cache: done.from_cache, mode: done.mode,
          qc: done.qc, qc_action: done.qc_action,
        };
        if (handle) updateMessage(handle, done.answer || text, done.sources, meta);
        else addMessage("bot", done.answer || text, done.sources, meta);
      } else if (!handle) {
        addMessage("bot", text || "（无响应）", [], null);
      }
    }

    // 提问
    composer.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = question.value.trim();
      if (!q) return;
      addMessage("user", q);
      question.value = "";
      addThinking();
      sendBtn.disabled = true;
      const useStream = $("#streamMode").checked && !$("#agentMode").checked;
      try {
        if (useStream) {
          await askStream(q);
          removeThinking();
        } else {
          const r = await fetch("/api/ask" + tokenParam(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: askBody(q, false),
          });
          const d = await r.json();
          removeThinking();
          if (d.ok) {
            if (d.session_id) sessionId = d.session_id;
            addMessage("bot", d.answer, d.sources, {
              confidence: d.confidence, confidence_level: d.confidence_level,
              confidence_reason: d.confidence_reason, hits: d.hits,
              compress: d.compress, from_cache: d.from_cache, mode: d.mode,
              qc: d.qc, qc_action: d.qc_action,
              steps: d.steps,
            });
          } else {
            addMessage("bot", "⚠️ " + d.error);
          }
        }
      } catch (err) {
        removeThinking();
        addMessage("bot", "⚠️ 请求失败：" + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    });

    refreshStats();
  </script>
</body>
</html>
